services:
  postgres:
    image: postgres:16-alpine
    container_name: walstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi_password}
      POSTGRES_DB: ${POSTGRES_DB:-walstar_cms}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-strapi} -d $${POSTGRES_DB:-walstar_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
