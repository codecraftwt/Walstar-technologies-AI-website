name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          script_stop: true # Stop execution immediately if any command fails
          script: |
            # 1. Load user environment & NVM (ensures node, npm, pm2 are in PATH)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            [ -s "$HOME/.profile" ] && source "$HOME/.profile"

            echo "=== Deployment Started: $(date) ==="

            # 2. Pull latest code from main branch
            echo "--> Pulling latest changes from Git..."
            cd /var/www/walstar-technologies-ai-website
            git fetch origin main
            git reset --hard origin/main

            # 3. Build Backend (Strapi)
            echo "--> Building Backend (Strapi)..."
            cd /var/www/walstar-technologies-ai-website/backend
            npm ci
            npm run build

            # 4. Build Frontend (Next.js)
            echo "--> Building Frontend (Next.js)..."
            cd /var/www/walstar-technologies-ai-website/frontend
            npm ci
            npm run build

            # 5. Restart PM2 processes only if both builds succeeded
            echo "--> Restarting PM2 processes..."
            pm2 restart walstar-strapi --update-env
            pm2 restart walstar-frontend --update-env

            echo "=== Deployment Completed Successfully! ==="
